services:
  pulse-space-postgres:
    image: postgres:18.4
    container_name: pulse-space-postgres
    environment:
      POSTGRES_USER: pulse_space
      POSTGRES_PASSWORD: pulse_space
      POSTGRES_DB: pulse_space
    ports:
      - "5434:5432"
    volumes:
      - pulse-space-pgdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_space -d pulse_space"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulse-space-pgdata:
